<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kissne · 开屏动画</title>
<style>
:root{--blue:#4FA8F5;--green:#8CC63F;--fit:1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FDFCF8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.viewport{position:fixed;left:50%;top:50%;width:390px;height:844px;overflow:hidden;background:#FDFCF8;transform:translate(-50%,-50%) scale(var(--fit));transform-origin:50% 50%}

.ball.blue{--orb1:#78C4FF;--orb2:#2D83D6}.ball.green{--orb1:#B5DE6D;--orb2:#6EA82E}

.zzz{height:29px;width:29px;margin-left:116px;top:calc(50% + 36px)}.hearts{width:72px;height:70px;top:calc(50% + 45px);margin-left:5px}.heart{position:absolute;width:18px;height:18px;background:#F599B0;transform:rotate(45deg);border-radius:4px}.heart:before,.heart:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:inherit}.heart:before{left:-9px}.heart:after{top:-9px}.heart.a{left:18px;top:27px}.heart.b{left:43px;top:10px;width:13px;height:13px;opacity:.78}.heart.b:before,.heart.b:after{width:13px;height:13px}.heart.b:before{left:-6.5px}.heart.b:after{top:-6.5px}
.flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(46% 34% at 50% 50%,#fff 0%,rgba(255,255,255,.86) 32%,rgba(255,255,255,0) 72%)}

</style>
</head>
<body>
<div class="viewport">
<div class="bg"></div><div class="motifs" id="motifs"></div>
<div class="stage" id="stage">
<img class="layer word kiss" id="wordKiss" src="assets/kiss.webp" alt="kiss">
<img class="layer word ne" id="wordNe" src="assets/ne.webp" alt="ne">
<div class="layer fuse" id="fuse"></div>
<div class="layer ball blue" id="ballBlue"></div><div class="layer ball green" id="ballGreen"></div>
<div class="layer morph fox" id="morphFox"></div><div class="layer morph sheep" id="morphSheep"></div>
<div class="layer actor fox" id="fox"></div><div class="layer actor sheep" id="sheep"></div><div class="layer actor pair" id="pair"></div>
<svg class="layer zzz" id="zzz" viewBox="0 0 60 64" fill="none" aria-hidden="true"><g stroke="#7FA8CC" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h20L10 34h20" stroke-width="6.5"/><path d="M30 34h14L31 52h14" stroke-width="4.5" opacity=".78"/></g></svg>
<div class="layer hearts" id="hearts"><i class="heart a"></i><i class="heart b"></i></div><div class="flash" id="flash"></div>
</div>
<div class="bar"><div class="track"><div class="fill" id="progress"></div></div></div>
</div>
<script>
(function(){

fit();addEventListener("resize",fit,{passive:true});addEventListener("orientationchange",fit,{passive:true});
var motifs=document.getElementById("motifs"),chars=["✿","✦","❋","·","✧"];for(var mi=0;mi<10;mi++){var m=document.createElement("span");m.className="motif";m.textContent=chars[mi%chars.length];m.style.left=(7+mi*9.7)%100+"%";m.style.fontSize=(9+(mi*7)%15)+"px";m.style.animationDuration=(8+(mi%6)*1.4)+"s";m.style.animationDelay=(-(mi*1.13)%10)+"s";m.style.opacity=(.13+(mi%4)*.06);motifs.appendChild(m)}
var $=function(id){return document.getElementById(id)},stage=$("stage"),wk=$("wordKiss"),wn=$("wordNe"),bb=$("ballBlue"),bg=$("ballGreen"),fu=$("fuse"),mf=$("morphFox"),ms=$("morphSheep"),fox=$("fox"),sheep=$("sheep"),pair=$("pair"),zzz=$("zzz"),hearts=$("hearts"),flash=$("flash"),progress=$("progress");
function clamp(v,a,b){a=a==null?0:a;b=b==null?1:b;return Math.max(a,Math.min(b,v))}function lerp(a,b,t){return a+(b-a)*t}function seg(t,a,b){return clamp((t-a)/(b-a))}
var E={outCubic:function(t){return 1-Math.pow(1-t,3)},inCubic:function(t){return t*t*t},inOutCubic:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},outBack:function(t,s){s=s==null?1.7:s;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)}};

function draw(t){
var p1=seg(t,0,1.1),e1=E.outBack(p1,2.2),kx=lerp(-430,0,E.outCubic(p1)),nx=lerp(430,0,E.outCubic(p1)),sc=lerp(.25,1,e1);

var mg=E.outCubic(clamp(p4/.62)),mfade=1-E.inOutCubic(clamp((p4-.55)/.45)),mop=(p4>.02?1:0)*clamp(mg*1.5)*mfade;op(mf,mop);op(ms,mop);tf(mf,"translate(-50%,0) translateX("+lerp(-spread,-78,mg)+"px) scale("+lerp(108/129,1,mg)+")");tf(ms,"translate(-50%,0) translateX("+lerp(spread,78,mg)+"px) scale("+lerp(108/110,1,mg)+")");
op(flash,Math.max(p4>.3&&p4<.8?Math.sin((p4-.3)/.5*Math.PI)*.8:0,p2>.5&&p2<.95?Math.sin((p2-.5)/.45*Math.PI)*.5:0));
var pw=seg(t,5.1,6.1),pk=seg(t,6.1,7.4),pairOp=clamp((pk-.42)/.3),fade=1-clamp((pk-.42)/.22),p5=seg(t,3.75,4.48),p6=seg(t,3.92,4.62),fd=E.outBack(p5,1.1),sd=E.outBack(p6,1.1),approach=E.inOutCubic(clamp(pk/.55)),fs=1+Math.sin(t*lerp(1.5,2.6,pw))*lerp(.018,.028,pw),ss=1+Math.sin(t*lerp(1.5,2.6,pw)+1.1)*lerp(.018,.028,pw);
op(fox,clamp((p5-.02)*8)*fade);op(sheep,clamp((p6-.02)*8)*fade);tf(fox,"translate(-50%,0) translateY("+lerp(-140,0,fd)+"px) translateX("+lerp(0,11,approach)+"px) scaleY("+fs+")");var hop=pk<=0&&pw>0?Math.abs(Math.sin(pw*Math.PI*1.6))*(1-pw)*12:0;tf(sheep,"translate(-50%,0) translateY("+(lerp(-130,0,sd)-hop)+"px) translateX("+lerp(0,-11,approach)+"px) scaleY("+ss+")");
if(t>=3.7){var f=pk>0?7:(pw>.4?[6,7,5,7][Math.floor((t-5.1)*4)%4]:[0,0,1,0,0,2][Math.floor(t*2.2)%6]);setFrame(fox,"fox",f)}if(t>=3.8){var s=pk>0?6:(pw>.25?[4,6,7,6][Math.floor((t-5.1)*3.4)%4]:[0,1,1,2,1,1][Math.floor(t*1.5)%6]);setFrame(sheep,"sheep",s)}
op(zzz,clamp(p4>.6?(1-E.outCubic(pw)):0)*.95);tf(zzz,"translate(-50%,-50%) translateY("+(Math.sin(t*2.1)*5)+"px) scale("+(1+Math.sin(t*2.1+.6)*.07)+")");
op(pair,pairOp);if(pk>.42){var kk=clamp((pk-.42)/.58),ord=[4,5,6,7],pi=Math.min(3,Math.floor(kk*4));setFrame(pair,"duo",ord[pi]);tf(pair,"translate(-50%,0) scale("+lerp(1.06,1,E.outBack(pairOp,1.2))+")")}
var ha=pk>.45?clamp(E.outBack(clamp((pk-.45)/.4),2.4)):0,hf=1-clamp((pk-.86)/.14);op(hearts,ha*hf);tf(hearts,"translate(-50%,-50%) translateY("+lerp(26,-46,E.outCubic(clamp((pk-.45)/.55)))+"px) translateX("+(Math.sin((t-6.1)*2.2)*7)+"px) scale("+(ha*(1+Math.sin((t-6.5)*7)*.1))+")");
tf(stage,"scale("+lerp(1,1.04,E.outCubic(clamp((pk-.55)/.45)))+")");progress.style.transform="scaleX("+clamp(t/7.4).toFixed(4)+")";
}
var mode=new URLSearchParams(location.search).get("mode")||"animate",raf=0,t0=performance.now(),playing=mode==="animate";
function frame(now){var t=(now-t0)/1000;draw(Math.min(t,TL.END));if(t<TL.END&&playing)raf=requestAnimationFrame(frame);else if(playing)notify()}
window.__seek=function(t){playing=false;if(raf)cancelAnimationFrame(raf);draw(clamp(t,0,TL.END));return true};
if(mode==="final"){draw(TL.END);window.__finished=true}else if(mode==="intro"){draw(.95)}else{
var urls=["fox","sheep","duo"].reduce(function(a,k){for(var i=0;i<8;i++)a.push(ROOT+k+"/frame-"+i+".webp");return a},["assets/kiss.webp","assets/ne.webp"]),imgs=urls.map(function(u){var im=new Image();im.src=u;return im});
Promise.race([Promise.all(imgs.map(function(im){return im.decode?im.decode().catch(function(){}):Promise.resolve()})),new Promise(function(r){setTimeout(r,1800)})]).then(function(){t0=performance.now();raf=requestAnimationFrame(frame)})
}
})();
</script>
</body>
