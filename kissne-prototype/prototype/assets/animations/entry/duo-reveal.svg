<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
<style>
  .a{animation:ksnup 2.6s ease-out infinite}
  .b{animation:ksnup 2.6s ease-out .3s infinite}
  @keyframes ksnup{0%{transform:translateY(14px);opacity:0}35%,100%{transform:translateY(0);opacity:1}}
  @media (prefers-reduced-motion: reduce){.a,.b{animation:none;opacity:1}}
</style>
  <rect x="3" y="3" width="114" height="114" rx="14" fill="#ECECF1" stroke="#CFCFD8" stroke-width="2"/>
  <circle class="a" cx="44" cy="60" r="20" fill="#CFE0F2"/>
  <circle class="b" cx="76" cy="60" r="20" fill="#D7EBDD"/>
  <text x="60" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9A9AA3" letter-spacing="1">duo · 占位</text>
</svg>
