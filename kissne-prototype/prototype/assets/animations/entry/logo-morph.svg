<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
<style>
  .k{transform-origin:60px 60px;animation:ksnmorph 2.9s ease-in-out infinite}
  @keyframes ksnmorph{0%{transform:scale(.4);opacity:0}30%{transform:scale(1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(.96);opacity:.9}}
  @media (prefers-reduced-motion: reduce){.k{animation:none;transform:scale(1);opacity:1}}
</style>
  <rect x="3" y="3" width="114" height="114" rx="14" fill="#fff" stroke="#CFCFD8" stroke-width="2"/>
  <text class="k" x="60" y="70" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#3A3A40">Kissne</text>
</svg>
