<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
<style>@media (prefers-reduced-motion: reduce){circle>animate{display:none}}</style>
  <circle cx="60" cy="60" r="26" fill="none" stroke="#9A9AA3" stroke-width="4">
    <animate attributeName="r" values="20;40" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="14" fill="#D7D7E0"/>
  <text x="60" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9A9AA3" letter-spacing="1">pulse · 占位</text>
</svg>
