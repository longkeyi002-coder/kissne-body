# Kissne HTML prototype — include this INSIDE the existing
# server { ... } block for yeqingxu.cyou:443.
#
# Existing API locations (/pair /bootstrap /messages /cancel) stay unchanged.
# The UI is served at: https://yeqingxu.cyou/kissne/
#
# NOTE: "alias" ends with "/" because the location also ends with "/".
location ^~ /kissne/ {
    alias /var/www/kissne-prototype/;
    index index.html;

    # Hash routing lives after "#", so nginx never sees it.
    # This fallback only handles direct static navigation under /kissne/.
    try_files $uri $uri/ /kissne/index.html;

    # Prototype changes frequently; HTML/JS/CSS should not be held stale.
    add_header Cache-Control "no-store" always;

    # Do not expose dotfiles even if they ever appear in the staged directory.
    location ~ /\. {
        deny all;
    }
}
