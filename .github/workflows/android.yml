name: Android
# Manual rebuild trigger after mobile fix #45.

on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/android/**", "kissne-prototype/prototype/**", ".github/workflows/android.yml"]
  push:
    branches: [main, kissne-main]
    paths: ["apps/android/**", "kissne-prototype/prototype/**", ".github/workflows/android.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Verify bundled web app
        run: |
          test -f ../../kissne-prototype/prototype/index.html
          test -f ../../kissne-prototype/prototype/app.js
          test -f ../../kissne-prototype/prototype/core.js
          test -f ../../kissne-prototype/prototype/screens-a.js
          test -f ../../kissne-prototype/prototype/screens-b.js
          test -f ../../kissne-prototype/prototype/styles.css
          test -f ../../kissne-prototype/prototype/transport.js
      - name: Chat lifecycle regressions
        run: node --test ../../tests-js/kissne-chat-lifecycle.test.mjs
      - name: Chat history and presentation regressions
        working-directory: tests-js
        run: |
          npm install --prefix "$RUNNER_TEMP/kissne-chat-tests" --ignore-scripts jsdom@29.1.1 vitest@4.1.10 fake-indexeddb@6.2.5
          ln -s "$RUNNER_TEMP/kissne-chat-tests/node_modules" node_modules
          "$RUNNER_TEMP/kissne-chat-tests/node_modules/.bin/vitest" run kissne-chat-history.test.mjs kissne-chat-presentation.test.mjs kissne-chat-store.test.mjs kissne-transport.test.mjs
      - run: gradle test
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kissne-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
