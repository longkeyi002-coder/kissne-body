name: Android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "kissne-prototype/prototype/**"
      - ".github/workflows/android.yml"
  push:
    branches: [kissne-main]
    paths:
      - "apps/android/**"
      - "kissne-prototype/prototype/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/android }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with: { gradle-version: "8.10" }

      - name: Verify fixed debug signing identity
        shell: bash
        run: |
          KEYSTORE="app/signing/kissne-debug.keystore"
          test -f "$KEYSTORE"
          ACTUAL=$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')
          EXPECTED="4A25EFA335E2A006D200C42421DA2A33287C422D79671C82EEE2992AAAD2CF63"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::Unexpected Kissne debug signing certificate: $ACTUAL"
            exit 1
          }

      - name: Check packaged WebView JavaScript
        run: |
          node --check ../../kissne-prototype/prototype/core.js
          node --check ../../kissne-prototype/prototype/transport.js
          node --check ../../kissne-prototype/prototype/screens-a.js
          node --check ../../kissne-prototype/prototype/screens-b.js
          node --check ../../kissne-prototype/prototype/app.js
      - run: gradle test
      - run: gradle assembleDebug
      - name: Verify built APK uses fixed debug signer
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          printf '%s\n' "$CERTS"
          ACTUAL=$(printf '%s\n' "$CERTS" \
            | grep -i 'certificate SHA-256 digest' \
            | head -1 \
            | sed 's/.*: //' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')
          EXPECTED="4A25EFA335E2A006D200C42421DA2A33287C422D79671C82EEE2992AAAD2CF63"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::APK signed by unexpected certificate: $ACTUAL"
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kissne-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

      # Temporary PR helper: lets us validate/re-sign a locally repackaged APK
      # with the exact user-supplied splash bundle. Remove before final merge.
      - name: Prepare APK signing helpers
        shell: bash
        run: |
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          test -f "$BUILD_TOOLS/lib/apksigner.jar"
          mkdir -p "$RUNNER_TEMP/kissne-apk-tools/lib"
          cp "$BUILD_TOOLS/apksigner" "$RUNNER_TEMP/kissne-apk-tools/"
          cp "$BUILD_TOOLS/zipalign" "$RUNNER_TEMP/kissne-apk-tools/"
          cp "$BUILD_TOOLS/lib/apksigner.jar" "$RUNNER_TEMP/kissne-apk-tools/lib/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kissne-apk-tools
          path: ${{ runner.temp }}/kissne-apk-tools

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/kissne-main'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.KISSNE_ANDROID_KEYSTORE_B64 }}
      KISSNE_ANDROID_STORE_PASSWORD: ${{ secrets.KISSNE_ANDROID_STORE_PASSWORD }}
      KISSNE_ANDROID_KEY_ALIAS: ${{ secrets.KISSNE_ANDROID_KEY_ALIAS }}
      KISSNE_ANDROID_KEY_PASSWORD: ${{ secrets.KISSNE_ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with: { gradle-version: "8.10" }

      - name: Detect stable signing
        id: signing
        shell: bash
        run: |
          if [[ -n "$SIGNING_KEYSTORE_B64" && -n "$KISSNE_ANDROID_STORE_PASSWORD" && -n "$KISSNE_ANDROID_KEY_ALIAS" && -n "$KISSNE_ANDROID_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stable Android signing secrets are not configured; release publishing is skipped."
          fi

      - name: Restore release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/kissne-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "KISSNE_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/android
        run: gradle assembleRelease

      - name: Prepare release metadata
        if: steps.signing.outputs.enabled == 'true'
        id: meta
        shell: bash
        run: |
          APK="apps/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/kissne-android.apk"
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' apps/android/app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts | head -1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          {
            echo "versionCode=$VERSION_CODE"
            echo "versionName=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/release-notes.txt" <<EOF
          versionCode=$VERSION_CODE
          versionName=$VERSION_NAME
          notes=Kissne Android 自动更新版本。安装时由 Android 系统校验固定应用签名。
          EOF

      - name: Publish stable update channel
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          git tag -f kissne-android-latest "$GITHUB_SHA"
          git push origin refs/tags/kissne-android-latest --force
          if gh release view kissne-android-latest >/dev/null 2>&1; then
            gh release edit kissne-android-latest \
              --title "Kissne Android ${{ steps.meta.outputs.versionName }}" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          else
            gh release create kissne-android-latest \
              --title "Kissne Android ${{ steps.meta.outputs.versionName }}" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
          gh release upload kissne-android-latest \
            "$RUNNER_TEMP/kissne-android.apk#kissne-android.apk" --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: kissne-android-release
          path: ${{ runner.temp }}/kissne-android.apk
