name: Android
# APK rebuild trigger

on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/android/**", "kissne-prototype/**", ".github/workflows/android.yml"]
  push:
    branches: [main, build/android-0.2.14]
    paths: ["apps/android/**", "kissne-prototype/**", ".github/workflows/android.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }
      - run: gradle test
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kissne-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
