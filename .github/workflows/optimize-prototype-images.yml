name: Optimize prototype image assets

on:
  push:
    branches:
      - feat/kissne-prototype-20260919
    paths:
      - ".github/workflows/optimize-prototype-images.yml"
      - "kissne-prototype/prototype/tools/optimize-images.py"
      - "kissne-prototype/prototype/assets/real/**"

permissions:
  contents: write

concurrency:
  group: prototype-image-optimizer
  cancel-in-progress: true

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, 'chore(prototype): optimize image assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kissne-prototype-20260919
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"

      - name: Optimize raster assets
        run: python kissne-prototype/prototype/tools/optimize-images.py

      - name: Commit optimized assets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kissne-prototype/prototype
          git commit -m "chore(prototype): optimize image assets"
          git push origin HEAD:feat/kissne-prototype-20260919
