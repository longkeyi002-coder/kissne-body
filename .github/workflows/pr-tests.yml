name: PR tests

# WHY THIS EXISTS
# ---------------
# The inherited upstream `Tests` lane (`.github/workflows/tests.yml`) requests
# `runs-on: ubuntu-latest-96-core`, and `tests-os.yml` requests
# `windows-latest-32-core`. Those are *larger runners*, which a free plan cannot
# provision: on this fork the two heaviest jobs sit in `queued` forever while
# every standard-runner job finishes (observed 2026-09-15 — `Python lints`,
# `Python tests / e2e`, `macOS-only tests`, `Docker`, `Nix` all completed, while
# `Python tests / Run tests` and `Windows-only tests` never started).
#
# Net effect: PRs on this fork carry no Python test signal at all. This workflow
# runs the SAME suite through the SAME entry point (`scripts/run_tests.sh`, which
# spawns one pytest subprocess per test file) on a standard `ubuntu-latest`
# runner, so every PR gets a real result without a paid plan.
#
# Only the runner label and the worker count differ from upstream's test job —
# the locked dependency install, ripgrep, and the test command are identical on
# purpose, so a green run here means the same thing as a green run upstream.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests (ubuntu-latest)
    runs-on: ubuntu-latest
    # Standard runner + the whole suite: slow but bounded. Measured upstream on a
    # 96-core runner at ~126s; a 4-core standard runner is roughly an order of
    # magnitude slower, hence the generous ceiling.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        # Same pinned, locked set as upstream's test job — including the extras
        # whose SDKs the hermetic test env requires up front
        # (HERMES_DISABLE_LAZY_INSTALLS=1 forbids mid-run installs).
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Run tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh
        env:
          # 4 vCPU standard runner: one worker per core, per upstream's own
          # measurement that workers above the core count only add contention.
          HERMES_TEST_WORKERS: 4
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
